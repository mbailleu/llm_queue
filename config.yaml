# anthropic_proxy config — edit and save; the proxy hot-reloads.
# Hot-reloadable: every key except the ones below.
# Restart required: upstream_base_url, listen_host, listen_port, throttle_listen_port.

# Where to forward requests. Set this to your custom service. Every path/header
# is forwarded verbatim, so the same upstream can serve both the Anthropic
# Messages API (/v1/messages) and the OpenAI-compatible API
# (/v1/chat/completions, /v1/responses) — both flow through the same queue.
upstream_base_url: "https://api.anthropic.com"

# Local listening socket for the HUMAN lane (Claude Code / interactive use).
# This lane is never throttled and has concurrency priority over automation.
listen_host: "127.0.0.1"
listen_port: 8787

# Second listening socket for the AUTOMATION lane (scripts / tight loops). Point
# batch jobs here; they are paced so they spend only the LEFTOVER request budget
# without starving the human lane. Both ports share one upstream, queue, tier
# auto-detection, and quota window — they differ only in admission policy.
# Set to null to disable the second lane entirely.
throttle_listen_port: 8788

# --- Automation-lane pacing ---
# Every quota budget of the active tier (see `tiers.*.limits` below) is
# evaluated and the most constraining ("binding") one sets the pace. Per
# budget, in that budget's units (requests, tokens, or $):
#   usable = limit - used
#            - human_demand_safety * human_rate * units_per_request(human)
#                                  * min(time_left, lookahead)
#            - human_quota_floor                     (requests budgets only)
#   rate   = (usable / units_per_request(auto)) / time_left
# so it holds back what humans are *statistically predicted* to still need.
# units_per_request converts requests <-> tokens/$ via live PER-LANE
# per-request EWMAs (the auto_assumed_* values below apply before any
# traffic): predicted human demand is sized from what human requests actually
# consume, and the leftover is turned into a request rate from what auto
# requests actually consume — interactive Claude Code requests (100k+ cached
# tokens each) and small scripted requests differ by orders of magnitude, and
# blending them made auto far too slow. Windows shorter than
# auto_pace_min_window_seconds don't pace at all (overruns there are throttled
# by the queue + upstream 429 backoff instead), and windows shorter than
# human_reserve_min_window_seconds skip the predicted-human term entirely (see
# below). As a window nears its end the prediction term shrinks to ~0, letting
# automation drain up to 100% of what's left. The rate is also capped by the
# physical pipe (free slots / measured avg request time), and concurrency
# stays bounded by max_concurrent (with human priority).
#
# If the pace ever looks wrong, don't guess: the dashboard's Auto Pacing card
# spells the whole calculation out (hover it for every term — which budget binds,
# what the human reserve costs, why the others don't count), and each quota card
# carries its own budget's arithmetic. Same text in JSON under `pacer.explain` in
# GET /_proxy/metrics.
#
# NOTE: for pacing to orient on COST budgets, model_pricing (bottom of this
# file) must cover the models you use — unpriced models bill $0, so the cost
# EWMA is 0 and cost budgets can neither fill nor bind. Use the ⚖ Calibrate
# dashboard dialog / GET /_proxy/calibrate/prices to derive prices.
# Master switch for automation-lane pacing. The dashboard's 🐢/🐇 button and
# POST /_proxy/pacer/enabled flip this same key at runtime (an edit here wins
# over them). POST /_proxy/pacer/release is the one-shot "let what's parked
# right now through" override, which leaves the computed rate alone.
auto_pacing_enabled: true
human_demand_safety: 1.5            # >1 leaves more headroom for humans (slower auto)
human_demand_horizon_seconds: 3600  # window over which the human request rate is measured
human_demand_lookahead_seconds: 3600  # cap on how far ahead that rate is projected when reserving quota
                                      # (keeps a long e.g. 5h window from reserving nearly all quota off a small human rate)
human_reserve_min_window_seconds: 300 # windows SHORTER than this get no predicted-human reservation:
                                      # a per-minute limit recovers in <=60s and humans are protected
                                      # there by queue priority + upstream 429 retries, so reserving on
                                      # it only starves auto — the reservation belongs to the long
                                      # (e.g. 5h cost) budgets. 0 = reserve on every window (old behavior).
auto_pace_min_window_seconds: 300     # windows SHORTER than this don't pace auto AT ALL — they never set
                                      # the admission rate and never park auto, even when fully spent.
                                      # Overruns on them are throttled by the lane's own mechanisms
                                      # (concurrency queue + upstream 429 retry/backoff); pacing lives on
                                      # the long budgets. 0 = pace on every window (old behavior).
human_quota_floor: 0                # hard floor of requests always kept free for humans (0 = purely statistical)
auto_concurrency_reserve: 0         # slots reserved for humans (auto capped at max_concurrent - this; 0 = rely on priority)
auto_assumed_request_seconds: 30.0  # avg UPSTREAM time assumed before any is measured. The
                                    # throughput cap is concurrency / upstream time, where
                                    # "upstream time" is only how long a request holds a slot —
                                    # time parked in the pacer, queued, or sleeping out a 429 is
                                    # excluded on purpose (counting it would let pacing delay
                                    # feed back into an ever-lower rate). The dashboard shows
                                    # the two halves side by side as "upstream" and "wait".
auto_assumed_tokens_per_request: 20000  # tokens per request assumed before any completion is measured
auto_assumed_cost_per_request: 0.05     # USD per request assumed before any completion is measured
auto_poll_seconds: 1.0              # how often a parked/over-pace auto request re-checks

# Which tier to assume at startup. The proxy will auto-switch from here based
# on what upstream actually accepts.
initial_tier: "low"   # "low" | "high"

# Manual override. null = auto-detect (recommended). Set to "low" or "high" to
# pin a specific tier and disable auto-tier switching.
force_tier: null

# Optional RECURRING DAILY automatic LOW->HIGH switch. Accepts unix epoch
# seconds, "HH:MM" / "HH:MM:SS", or an ISO-8601 datetime — only the local
# time-of-day matters, and the switch fires at that time EVERY DAY. At each fire
# the tier promotes to HIGH (auto-demotes on the next rate-limit, like a boost —
# use force_tier to pin instead). Before it fires, the pacer treats the current
# LOW window as ending at the switch time, so background traffic drains the
# leftover over the shorter horizon. null = no daily switch.
#
# A separate ONE-SHOT switch (fires once, then clears) is available at runtime and
# is independent of this daily one — the proxy acts on whichever comes first:
#   curl -X POST localhost:8787/_proxy/schedule_high -d '{"at": "14:30"}'   # arm one-shot
#   curl -X POST localhost:8787/_proxy/schedule_high -d '{"at": null}'      # clear one-shot
scheduled_high_at: null

# Optional RECURRING DAILY automatic HIGH->LOW switch — the mirror of
# scheduled_high_at. Same value formats; at that local time-of-day the tier drops
# to LOW every day. Pair it with scheduled_high_at to run HIGH during a daily
# window and LOW the rest of the day. null = no daily switch. A separate ONE-SHOT
# switch is available at runtime, independent of this daily one:
#   curl -X POST localhost:8787/_proxy/schedule_low -d '{"at": "09:00"}'    # arm one-shot
#   curl -X POST localhost:8787/_proxy/schedule_low -d '{"at": null}'       # clear one-shot
scheduled_low_at: null

# The two tiers — each has a max concurrency cap plus a LIST of rolling quota
# budgets (`limits`). Every entry is one budget: `limit` units of `metric` per
# `window_seconds`, where metric is
#   requests — weighted request count (see model_window_weights below)
#   tokens   — input + output + cache_creation + cache_read tokens
#   cost     — USD, priced via model_pricing (an UNPRICED model contributes $0,
#              so cost budgets only mean something for models listed there!)
# All budgets are tracked simultaneously and each window rolls independently
# (a 60s window rolls many times inside a 5h one). Requests are counted at
# admission; tokens/cost land when the response completes. The most-utilized
# budget is the "binding" one shown by the dashboard/statusline, and the
# auto-lane pacer paces against whichever budget is most constraining.
#
# GROUPS: an optional `group` name puts several budgets on ONE shared timer —
# they anchor together on the first request and roll together, instead of each
# re-anchoring whenever the next request/completion happens to touch it. This
# is what upstream per-minute limits actually look like: one 60s clock counting
# requests AND tokens AND dollars, not three clocks that drift apart. Because a
# group IS one window, all its budgets must declare the same `window_seconds`
# (an entry that disagrees is logged and left on its own timer). Budgets with
# no `group` stay independent, exactly as before. The dashboard names the group
# on each quota card, and /_proxy/window/{count,start} take a "group" selector
# (anchoring any member anchors the whole group).
#
# There is still no preemptive human-lane enforcement: humans are admitted as
# fast as max_concurrent allows, and when upstream rate-limits (429/503/529)
# the proxy retries with backoff so callers wait then. The proxy auto-detects
# which tier upstream currently allows by probing HIGH when LOW is saturated
# (see promotion_cooldown_seconds). All the active tier's windows RESTART
# (fresh counts + timers, under the new tier's budgets) every time the active
# tier switches LOW<->HIGH.
#
# LEGACY STYLE (still fully supported, in case the plan reverts to
# request-based limits): omit `limits` and give the tier window_seconds /
# window_limit — that becomes a single requests budget. When those are omitted
# too they fall back to the top-level rate_window_seconds / rate_window_limit
# below. If a tier has BOTH `limits` and the legacy keys, `limits` wins.
tiers:
  low:
    max_concurrent: 4                                        # concurrent requests
    limits:                                                            # one 60s clock ("minute"):
      - {metric: requests, limit: 20,     window_seconds: 60,    group: minute}    # 20 req/min
      - {metric: tokens,   limit: 500000, window_seconds: 60,    group: minute}    # 500k tokens/min
      - {metric: cost,     limit: 50,     window_seconds: 60,    group: minute}    # $50/min
      - {metric: cost,     limit: 30,     window_seconds: 18000, group: session}   # $30 per 5h
  high:
    max_concurrent: 1000                                     # concurrent requests
    limits:
      - {metric: requests, limit: 1000,   window_seconds: 60,    group: minute}    # 1000 req/min
      - {metric: tokens,   limit: 500000, window_seconds: 60,    group: minute}    # 500k tokens/min
      - {metric: cost,     limit: 50,     window_seconds: 60,    group: minute}    # $50/min
      - {metric: cost,     limit: 100,    window_seconds: 3600,  group: session}   # $100 per 1h
# Legacy example (single request window per tier):
# tiers:
#   low:
#     max_concurrent: 4
#     window_seconds: 18000     # 5h
#     window_limit: 600
#   high:
#     max_concurrent: 1000
#     window_seconds: 3600      # 1h
#     window_limit: 99999       # per-hour ceiling once promoted to HIGH

# --- Adaptive HIGH concurrency ---
# On HIGH, `max_concurrent` above is an UPPER BOUND, not a target. The real
# ceiling is whatever parallelism upstream tolerates before it starts throwing
# 429s — with a 500k tokens/minute limit that is reached at some concurrency no
# config can predict, and demoting the whole tier on every 429 collapses
# throughput to LOW's 4 slots over and over.
#
# With this enabled, a rate-limit while on HIGH instead SHRINKS the concurrency
# estimate and keeps the tier:
#   new_cap = max(min_concurrent, floor(in_flight_at_the_429 * decrease_factor))
# using the concurrency actually observed at the 429 (so a cap of 1000 that only
# ever sees 30 parallel requests still converges in one step), at most once per
# cooldown so one overload burst counts as one signal. It grows back by
# increase_step every increase_after successes that ran while the cap was
# actually saturated — an idle lane never ratchets it back up.
# Only when the estimate has bottomed out at min_concurrent and upstream STILL
# rate-limits does the old HIGH->LOW demotion happen (see demote_at_min): at
# LOW-level parallelism, pushback means the tier is wrong, not the concurrency.
# Entering HIGH again restarts the search from start_concurrent.
# LOW is never adapted. The dashboard's In Flight card shows the live estimate.
high_adaptive_concurrency: true
high_adaptive_min_concurrent: 4       # never search below this (LOW's cap is a sane floor)
high_adaptive_max_concurrent: null    # extra ceiling; null = tiers.high.max_concurrent
high_adaptive_start_concurrent: null  # estimate when HIGH starts; null = the ceiling
high_adaptive_decrease_factor: 0.5    # multiplicative decrease from the observed concurrency
high_adaptive_increase_step: 1        # slots added per increase
high_adaptive_increase_after: 20      # saturated successes needed per increase
high_adaptive_cooldown_seconds: 15.0  # quiet period after a decrease (also blocks growth)
high_adaptive_demote_at_min: true     # false = stay HIGH forever, just at min_concurrent

# After a HIGH->LOW demotion (or a failed probe), wait this many seconds before
# trying to probe HIGH again.
promotion_cooldown_seconds: 300

# Retry behavior when upstream returns 429/503/529 or connection errors.
# - retry_max_attempts bounds CONNECTION-error retries (a down upstream won't be
#   fixed by waiting), using exponential backoff.
# - retry_max_elapsed_seconds bounds RATE-LIMIT (429/503/529) retries by total
#   wall-clock time. Set a bit above rate_window_seconds so a queued request can
#   outlast a full quota window and still run once the quota resets, instead of
#   being purged after a few minutes. NOTE: your client must also keep its
#   connection open this long (Claude Code's own timeout still applies).
retry_max_attempts: 12
retry_base_delay: 1.0          # seconds; doubled each attempt
retry_max_delay: 60.0          # cap per backoff sleep (exponential branch)
retry_max_elapsed_seconds: 18900   # 5h15m — outlasts the 5h window below
upstream_timeout: 600          # per-request timeout (seconds)

# LEGACY fallback rolling request-quota window — used only by tiers that have
# no `limits` list AND don't set their own window_seconds/window_limit above
# (so older single-window configs keep working). The upstream "N requests per
# W seconds" budget is anchored at the first request after the previous window
# expired ("the window starts when the first request is sent"). TRACKED for
# the dashboard quota indicators and time bars; NOT enforced here — the
# upstream 429 + the retry/backoff above are what actually pace you.
rate_window_seconds: 18000     # 5h
rate_window_limit: 600         # requests per window (fallback default)

# Per-model weighting for the window count. A request for a listed model counts
# as `factor` requests toward REQUESTS-metric budgets — e.g. an Opus request can
# cost 2 or 4 while a Haiku request costs 1. Token/cost budgets are unaffected
# (they already measure real consumption). This affects ONLY the rolling window
# counts; per-request metrics and per-model stats/counts still count each
# request exactly once (no double-counting elsewhere).
# Matching: exact model name first, then substring (so "opus" matches
# "claude-opus-4-20250514"). Models not matched use default_window_weight.
# Weights must be > 0; invalid entries are ignored (fall back to the default).
default_window_weight: 1
model_window_weights: {}
# model_window_weights:
#   claude-opus-4-7: 4
#   opus: 4            # substring fallback for any opus model/date suffix
#   claude-sonnet-4-6: 2
#   claude-haiku: 1

log_level: "INFO"         # DEBUG | INFO | WARNING | ERROR

# How often the proxy checks this config file for changes.
config_poll_seconds: 2.0

# Long-horizon statistics, persisted to disk so weekly/monthly/lifetime totals
# and the dashboard graphs survive restarts. Completions are folded into hourly
# per-model buckets (plus running lifetime totals) and written out on an
# interval — not on every request.
stats_persist_path: "stats.json"   # file to read/write; relative to CWD
stats_flush_seconds: 60.0          # min seconds between disk writes (when dirty)
stats_retention_days: 120          # how long hourly buckets (the graph history)
                                   # are kept; lifetime totals are kept forever

# Current rolling-window state (one entry per budget window: count + start) is
# persisted here every ~5s and on shutdown, then restored on boot — entries
# whose window has already elapsed (now - start >= its window_seconds) or whose
# budget no longer exists are discarded and start fresh. A pre-budgets
# (single-window) file restores into the requests budget. Set/override at
# runtime — optional "metric" / "window_seconds" select the budget window
# (default: the requests window for count, all windows for start):
#   curl -X POST localhost:8787/_proxy/window/count -d '{"count": 120}'
#   curl -X POST localhost:8787/_proxy/window/count \
#        -d '{"count": 12.5, "metric": "cost", "window_seconds": 18000}'
#   curl -X POST localhost:8787/_proxy/window/start -d '{"started_at": 1733250000}'
window_persist_path: "window.json"

# Price-calibration snapshots: pairs of (the provider's cumulative cost
# counters, the proxy's own per-model token counters), persisted so estimates
# keep improving across restarts. Record one whenever convenient with your
# provider's cumulative since-plan-change numbers (USD):
#   curl -X POST localhost:8787/_proxy/calibrate/snapshot \
#        -d '{"cost_input_uncached": 12.31, "cost_input_cached": 0.85, "cost_output": 7.02}'
# then read the derived per-model $/Mtok estimates (incl. a ready-to-paste
# model_pricing block) from:
#   curl localhost:8787/_proxy/calibrate/prices
# POST /_proxy/calibrate/reset drops all snapshots (provider counters reset /
# prices changed again).
calibration_persist_path: "calibration.json"

# Optional per-model pricing for cost calculation (per 1,000,000 tokens, in
# whatever unit your provider bills in — dollars, credits, etc.).
# - If a model isn't listed, its cost shows as "—" on the dashboard AND it
#   contributes $0 to any cost budgets in `tiers.*.limits` — configure pricing
#   for every model you use if you rely on cost budgets. With no pricing at
#   all, cost budgets are invisible to the auto-lane pacer too (a $0
#   per-request estimate can't be converted into a request rate), so pacing
#   falls through to the requests/tokens budgets.
# - If cache_creation / cache_read are omitted, they default to the input rate.
# Uncomment + edit to your provider's actual rates.
model_pricing: {}
# model_pricing:
#   claude-opus-4-7:
#     input: 15.0
#     output: 75.0
#     cache_creation: 18.75
#     cache_read: 1.50
#   claude-sonnet-4-6:
#     input: 3.0
#     output: 15.0
#     cache_creation: 3.75
#     cache_read: 0.30
#   # OpenAI-compatible models are keyed the same way (by the `model` field).
#   # OpenAI bills cached input cheaper and has no cache-write charge, so set
#   # cache_read and leave cache_creation unset (it defaults to the input rate
#   # but no cache-write tokens are ever reported for OpenAI).
#   gpt-4o:
#     input: 2.5
#     output: 10.0
#     cache_read: 1.25
