[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anthropic-proxy"
version = "0.1.0"
description = "Queueing reverse proxy for LLM APIs: concurrency tiers, rate-limit retries, token/cost metrics, live dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anthropic-proxy = "anthropic_proxy.server:main"

[tool.hatch.build.targets.wheel]
packages = ["anthropic_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
