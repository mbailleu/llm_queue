[project]
name = "anthropic_proxy"
version = "0.3.0"
description = "A two-lane (human/automation) queueing proxy for LLM APIs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.scripts]
anthropic-proxy = "anthropic_proxy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anthropic_proxy"]

[tool.setuptools.package-data]
anthropic_proxy = ["dashboard/*"]
